{{- if or .Values.steam_username .Values.steam_password }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.name }}-secrets"
type: Opaque
stringData:
  {{- if .Values.steam_username }}
  STEAM_USERNAME: "{{ .Values.steam_username }}"
  {{- end }}
  {{- if .Values.steam_password }}
  STEAM_PASSWORD: "{{ .Values.steam_password }}"
  {{- end }}
{{- end }}
