# Game servers listen on TCP/UDP — the Service carries the traffic directly.
# type: NodePort (default) exposes a high port on every node;
#       LoadBalancer allocates an external IP when the cluster has MetalLB
#       or a cloud load balancer. Choose at launch via the service_type field.
# Do NOT add an ingress for the game traffic itself — nginx ingress is
# HTTP/HTTPS only and cannot proxy raw game packets.
#
# Satisfactory listens on its DERIVED nodePorts (see _helpers.tpl and the
# GAME_PORT/RELIABLE_PORT envs in server.yaml): the server's announced
# ports are always the reachable ones, so the client's reliable channel
# resolves correctly whether it derives entered+1 or uses the announced
# value. Service port == nodePort == what the pod binds. Game (UDP+TCP)
# shares port N; the reliable channel is N+1. No user override — always
# auto-derived from the instance name.
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.name }}"
spec:
  type: {{ .Values.service_type }}
  selector:
    app: "{{ .Values.name }}"
  ports:
    - name: game-udp
      port: {{ include "satisfactory.nodeport" . }}
      targetPort: game-udp
      protocol: UDP
      nodePort: {{ include "satisfactory.nodeport" . }}
    - name: game-tcp
      port: {{ include "satisfactory.nodeport" . }}
      targetPort: game-tcp
      protocol: TCP
      nodePort: {{ include "satisfactory.nodeport" . }}
    - name: reliable
      port: {{ add (int (include "satisfactory.nodeport" .)) 1 }}
      targetPort: reliable
      protocol: TCP
      nodePort: {{ add (int (include "satisfactory.nodeport" .)) 1 }}
