apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Values.name }}"
  annotations:
    juno-innovations.com/workload: "Server"
  labels:
    app: "{{ .Values.name }}"
spec:
  replicas: 1
  serviceName: "{{ .Values.name }}"
  selector:
    matchLabels:
      app: "{{ .Values.name }}"
  template:
    metadata:
      labels:
        app: "{{ .Values.name }}"
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      hostname: "{{ .Values.name }}"

      # Image runs as uid/gid 1000 — group-writable volume access
      securityContext:
        fsGroup: 1000

      {{- if .Values.pullSecret }}
      imagePullSecrets:
        - name: "{{ .Values.pullSecret }}"
      {{- end }}

      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}

      containers:
        - name: satisfactory
          imagePullPolicy: IfNotPresent
          image: "{{ .Values.registry }}/{{ .Values.repo }}:{{ .Values.tag }}"
          ports:
            - containerPort: {{ include "satisfactory.nodeport" . }}
              name: game-udp
              protocol: UDP
            - containerPort: {{ include "satisfactory.nodeport" . }}
              name: game-tcp
              protocol: TCP
            - containerPort: {{ add (int (include "satisfactory.nodeport" .)) 1 }}
              name: reliable
              protocol: TCP
          env:
            - name: JUNO_WORKSTATION
              value: "{{ .Values.name }}"
            - name: JUNO_PROJECT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JUNO_WORKSPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JUNO_ENVIRONMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: USER
              value: "{{ .Values.user }}"
            - name: HOME
              value: "/home/{{ .Values.user }}"
            - name: UID
              value: "{{ .Values.puid }}"
            - name: GID
              value: "{{ .Values.guid }}"
            # The server LISTENS on its auto-derived nodePorts (see
            # _helpers.tpl) — its announced ports are always the reachable
            # ones, so the client's reliable channel resolves whether it
            # derives entered+1 or uses the announced value.
            - name: GAME_PORT
              value: {{ include "satisfactory.nodeport" . | quote }}
            - name: RELIABLE_PORT
              value: {{ add (int (include "satisfactory.nodeport" .)) 1 | quote }}
            - name: MAX_PLAYERS
              value: {{ .Values.max_players | quote }}
            - name: BRANCH
              value: {{ .Values.branch | quote }}
            - name: UPDATE_ON_START
              value: {{ .Values.update_on_start | quote }}
            - name: AUTO_PAUSE
              value: {{ .Values.auto_pause | quote }}
            - name: AUTO_SAVE_ON_DISCONNECT
              value: {{ .Values.auto_save_on_disconnect | quote }}
            - name: GAME_MANIFEST
              value: {{ .Values.game_manifest | quote }}
            # Online integration mode. Undefined (image default) = NO online
            # subsystem → every join dies with ConnectionTimeout ~6s after
            # login. EOS was tried first but the image's UE SSL stack fails
            # to init ("Failed to initialize SSL state for Socket
            # HttpRequest") so EOS session validation never completes —
            # same kick. Steam mode validates via Steamworks (the image
            # ships the SteamLimited online-services plugin) and joins are
            # Steam-identity anyway.
            - name: PREFERRED_ONLINE_INTEGRATION_MODE
              value: "Steam"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            {{- if .Values.steam_username }}
            - name: STEAM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.name }}-secrets"
                  key: STEAM_USERNAME
            {{- end }}
            {{- if .Values.steam_password }}
            - name: STEAM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.name }}-secrets"
                  key: STEAM_PASSWORD
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          # Game port listens on TCP too (Satisfactory uses UDP+TCP on the
          # same port) — a real tcpSocket probe target against the derived
          # port the server binds. First boot runs DepotDownloader (large
          # download): 10-minute startup budget.
          startupProbe:
            tcpSocket:
              port: {{ include "satisfactory.nodeport" . }}
            initialDelaySeconds: 10
            failureThreshold: 120
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ include "satisfactory.nodeport" . }}
            failureThreshold: 6
            periodSeconds: 30
          resources:
            requests:
              cpu: "{{ .Values.cpu }}"
              memory: "{{ .Values.memory }}"
            {{- if or .Values.cpuLimit .Values.memoryLimit }}
            limits:
              {{- if .Values.cpuLimit }}
              cpu: "{{ .Values.cpuLimit }}"
              {{- end }}
              {{- if .Values.memoryLimit }}
              memory: "{{ .Values.memoryLimit }}"
              {{- end }}
            {{- end }}
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - name: data
              mountPath: /satisfactory
              subPath: {{ .Values.files_subpath }}
            - name: data
              mountPath: /home/steam/.config/Epic/FactoryGame/Saved/SaveGames
              subPath: {{ .Values.saves_subpath }}
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}
            {{- if .Values.plugins }}
            {{- range .Values.plugins }}
            - name: {{ .name | quote }}
              subPath: {{ .file | quote }}
              mountPath: "/etc/helios/init.d/{{ .name }}/{{ .file }}"
            {{- end }}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "{{ .Values.name }}-data"
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        {{- if .Values.volumeMounts }}
        {{- toYaml .Values.volumes | nindent 8 }}
        {{- end }}
        {{- if .Values.plugins }}
        {{- range .Values.plugins }}
        - name: {{ .name | quote }}
          configMap:
            name: {{ .config | quote }}
            defaultMode: 0777
        {{- end }}
        {{- end }}
