apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Values.name }}"
  annotations:
    juno-innovations.com/workload: "Server"
  labels:
    app: "{{ .Values.name }}"
spec:
  replicas: 1
  serviceName: "{{ .Values.name }}"
  selector:
    matchLabels:
      app: "{{ .Values.name }}"
  template:
    metadata:
      labels:
        app: "{{ .Values.name }}"
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      hostname: "{{ .Values.name }}"

      # Image runs as uid/gid 1000 — group-writable volume access
      securityContext:
        fsGroup: 1000

      {{- if .Values.pullSecret }}
      imagePullSecrets:
        - name: "{{ .Values.pullSecret }}"
      {{- end }}

      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}

      containers:
        - name: satisfactory
          imagePullPolicy: IfNotPresent
          image: "{{ .Values.registry }}/{{ .Values.repo }}:{{ .Values.tag }}"
          ports:
            - containerPort: {{ .Values.gamePort }}
              name: game-udp
              protocol: UDP
            - containerPort: {{ .Values.gamePort }}
              name: game-tcp
              protocol: TCP
            {{- range .Values.extraPorts }}
            - containerPort: {{ .port }}
              name: {{ .name }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          env:
            - name: JUNO_WORKSTATION
              value: "{{ .Values.name }}"
            - name: JUNO_PROJECT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JUNO_WORKSPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JUNO_ENVIRONMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: USER
              value: "{{ .Values.user }}"
            - name: HOME
              value: "/home/{{ .Values.user }}"
            - name: UID
              value: "{{ .Values.puid }}"
            - name: GID
              value: "{{ .Values.guid }}"
            - name: GAME_PORT
              value: {{ .Values.gamePort | quote }}
            - name: RELIABLE_PORT
              value: "7778"
            - name: MAX_PLAYERS
              value: {{ .Values.max_players | quote }}
            - name: BRANCH
              value: {{ .Values.branch | quote }}
            - name: UPDATE_ON_START
              value: {{ .Values.update_on_start | quote }}
            - name: AUTO_PAUSE
              value: {{ .Values.auto_pause | quote }}
            - name: AUTO_SAVE_ON_DISCONNECT
              value: {{ .Values.auto_save_on_disconnect | quote }}
            - name: GAME_MANIFEST
              value: {{ .Values.game_manifest | quote }}
            # The image defaults this to Undefined, which leaves the server
            # with NO online subsystem (OSS: LoadSubsystemModule([None])
            # failed) — every join dies with ConnectionTimeout ~6s after
            # login. EOS is the working mode for dedicated servers.
            - name: PREFERRED_ONLINE_INTEGRATION_MODE
              value: "EOS"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            {{- if .Values.steam_username }}
            - name: STEAM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.name }}-secrets"
                  key: STEAM_USERNAME
            {{- end }}
            {{- if .Values.steam_password }}
            - name: STEAM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.name }}-secrets"
                  key: STEAM_PASSWORD
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          # Game port listens on TCP too (Satisfactory uses UDP+TCP on 7777)
          # — a real tcpSocket probe target. First boot runs DepotDownloader
          # (large download): 10-minute startup budget.
          startupProbe:
            tcpSocket:
              port: {{ .Values.gamePort }}
            initialDelaySeconds: 10
            failureThreshold: 120
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.gamePort }}
            failureThreshold: 6
            periodSeconds: 30
          resources:
            requests:
              cpu: "{{ .Values.cpu }}"
              memory: "{{ .Values.memory }}"
            {{- if or .Values.cpuLimit .Values.memoryLimit }}
            limits:
              {{- if .Values.cpuLimit }}
              cpu: "{{ .Values.cpuLimit }}"
              {{- end }}
              {{- if .Values.memoryLimit }}
              memory: "{{ .Values.memoryLimit }}"
              {{- end }}
            {{- end }}
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - name: data
              mountPath: /satisfactory
              subPath: {{ .Values.files_subpath }}
            - name: data
              mountPath: /home/steam/.config/Epic/FactoryGame/Saved/SaveGames
              subPath: {{ .Values.saves_subpath }}
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}
            {{- if .Values.plugins }}
            {{- range .Values.plugins }}
            - name: {{ .name | quote }}
              subPath: {{ .file | quote }}
              mountPath: "/etc/helios/init.d/{{ .name }}/{{ .file }}"
            {{- end }}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "{{ .Values.name }}-data"
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        {{- if .Values.volumeMounts }}
        {{- toYaml .Values.volumes | nindent 8 }}
        {{- end }}
        {{- if .Values.plugins }}
        {{- range .Values.plugins }}
        - name: {{ .name | quote }}
          configMap:
            name: {{ .config | quote }}
            defaultMode: 0777
        {{- end }}
        {{- end }}
