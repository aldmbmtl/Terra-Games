apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Values.name }}"
  annotations:
    juno-innovations.com/workload: "Server"
  labels:
    app: "{{ .Values.name }}"
spec:
  replicas: 1
  serviceName: "{{ .Values.name }}"
  selector:
    matchLabels:
      app: "{{ .Values.name }}"
  template:
    metadata:
      labels:
        app: "{{ .Values.name }}"
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      hostname: "{{ .Values.name }}"

      # Image runs as uid/gid 1000 — group-writable volume access
      securityContext:
        fsGroup: 1000

      {{- if .Values.pullSecret }}
      imagePullSecrets:
        - name: "{{ .Values.pullSecret }}"
      {{- end }}

      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}

      containers:
        - name: conan-exiles
          imagePullPolicy: IfNotPresent
          image: "{{ .Values.registry }}/{{ .Values.repo }}:{{ .Values.tag }}"
          ports:
            - containerPort: {{ .Values.gamePort }}
              name: game
              protocol: {{ .Values.gameProtocol }}
            {{- if .Values.rcon_password }}
            - containerPort: 25575
              name: rcon
              protocol: TCP
            {{- end }}
          env:
            - name: JUNO_WORKSTATION
              value: "{{ .Values.name }}"
            - name: JUNO_PROJECT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JUNO_WORKSPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JUNO_ENVIRONMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: USER
              value: "{{ .Values.user }}"
            - name: HOME
              value: "/home/{{ .Values.user }}"
            - name: UID
              value: "{{ .Values.puid }}"
            - name: GID
              value: "{{ .Values.guid }}"
            - name: PORT
              value: {{ .Values.gamePort | quote }}
            - name: QUERY_PORT
              value: "27015"
            - name: RCON_PORT
              value: "25575"
            - name: MAX_PLAYERS
              value: {{ .Values.max_players | quote }}
            - name: SERVER_NAME
              value: {{ .Values.server_name | quote }}
            - name: MODS
              value: {{ .Values.mods | quote }}
            - name: UPDATE_ON_START
              value: {{ .Values.update_on_start | quote }}
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            {{- if .Values.server_password }}
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.name }}-secrets"
                  key: SERVER_PASSWORD
            {{- end }}
            {{- if .Values.admin_password }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.name }}-secrets"
                  key: ADMIN_PASSWORD
            {{- end }}
            {{- if .Values.rcon_password }}
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.name }}-secrets"
                  key: RCON_PASSWORD
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          # RCON is NOT a reliable probe target: the image writes
          # RconEnabled=1, but the UE5 Enhanced build was observed NOT
          # binding 25575 (connection refused on a live launch). exec probe
          # checks the verified binary name instead. Bracketed patterns
          # prevent the probe's own shell from matching itself. First boot
          # runs DepotDownloader (large download): 10-minute startup budget.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f '[C]onanSandboxServer-Linux-Shipping' || ps aux | grep -q '[C]onanSandboxServer-Linux-Shipping'"
            initialDelaySeconds: 10
            failureThreshold: 120
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f '[C]onanSandboxServer-Linux-Shipping' || ps aux | grep -q '[C]onanSandboxServer-Linux-Shipping'"
            failureThreshold: 6
            periodSeconds: 30
          resources:
            requests:
              cpu: "{{ .Values.cpu }}"
              memory: "{{ .Values.memory }}"
            {{- if or .Values.cpuLimit .Values.memoryLimit }}
            limits:
              {{- if .Values.cpuLimit }}
              cpu: "{{ .Values.cpuLimit }}"
              {{- end }}
              {{- if .Values.memoryLimit }}
              memory: "{{ .Values.memoryLimit }}"
              {{- end }}
            {{- end }}
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - name: data
              mountPath: /home/steam/server-files
              subPath: {{ .Values.server_files_subpath }}
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}
            {{- if .Values.plugins }}
            {{- range .Values.plugins }}
            - name: {{ .name | quote }}
              subPath: {{ .file | quote }}
              mountPath: "/etc/helios/init.d/{{ .name }}/{{ .file }}"
            {{- end }}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "{{ .Values.name }}-data"
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        {{- if .Values.volumeMounts }}
        {{- toYaml .Values.volumes | nindent 8 }}
        {{- end }}
        {{- if .Values.plugins }}
        {{- range .Values.plugins }}
        - name: {{ .name | quote }}
          configMap:
            name: {{ .config | quote }}
            defaultMode: 0777
        {{- end }}
        {{- end }}
