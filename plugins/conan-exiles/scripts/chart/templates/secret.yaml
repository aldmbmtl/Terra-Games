{{- if or (or .Values.server_password .Values.admin_password) .Values.rcon_password }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.name }}-secrets"
type: Opaque
stringData:
  {{- if .Values.server_password }}
  SERVER_PASSWORD: "{{ .Values.server_password }}"
  {{- end }}
  {{- if .Values.admin_password }}
  ADMIN_PASSWORD: "{{ .Values.admin_password }}"
  {{- end }}
  {{- if .Values.rcon_password }}
  RCON_PASSWORD: "{{ .Values.rcon_password }}"
  {{- end }}
{{- end }}
