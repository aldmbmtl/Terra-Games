apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Values.name }}"
  annotations:
    juno-innovations.com/workload: "Server"
  labels:
    app: "{{ .Values.name }}"
spec:
  replicas: 1
  serviceName: "{{ .Values.name }}"
  selector:
    matchLabels:
      app: "{{ .Values.name }}"
  template:
    metadata:
      labels:
        app: "{{ .Values.name }}"
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      hostname: "{{ .Values.name }}"
      {{- if .Values.pullSecret }}
      imagePullSecrets:
        - name: "{{ .Values.pullSecret }}"
      {{- end }}

      containers:
        - name: minecraft
          imagePullPolicy: IfNotPresent
          image: "{{ .Values.registry }}/{{ .Values.repo }}:{{ .Values.tag }}"
          ports:
            - containerPort: {{ .Values.gamePort }}
              name: game
              protocol: {{ .Values.gameProtocol }}
            {{- if .Values.rcon_enabled }}
            - containerPort: 25575
              name: rcon
              protocol: TCP
            {{- end }}
          env:
            - name: JUNO_WORKSTATION
              value: "{{ .Values.name }}"
            - name: JUNO_PROJECT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JUNO_WORKSPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JUNO_ENVIRONMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: USER
              value: "{{ .Values.user }}"
            - name: HOME
              value: "/home/{{ .Values.user }}"
            - name: UID
              value: "{{ .Values.puid }}"
            - name: GID
              value: "{{ .Values.guid }}"
            # EULA must be the literal string TRUE/FALSE — uppercase.
            # toString: Kuiper emits the select value unquoted → YAML 1.1
            # parses TRUE/FALSE as bools; upper is string-only.
            - name: EULA
              value: {{ .Values.eula_accept | toString | upper | quote }}
            - name: TYPE
              value: {{ .Values.server_type | quote }}
            - name: VERSION
              value: {{ .Values.version | quote }}
            - name: MEMORY
              value: {{ .Values.jvm_memory | quote }}
            - name: DIFFICULTY
              value: {{ .Values.difficulty | quote }}
            # | quote on all fields — user values arrive as typed YAML
            # (max_players lands as int), k8s rejects non-string envs.
            - name: MAX_PLAYERS
              value: {{ .Values.max_players | quote }}
            - name: RCON_ENABLED
              value: {{ .Values.rcon_enabled | quote }}
            {{- if .Values.rcon_password }}
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.name }}-secrets"
                  key: RCON_PASSWORD
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          # First boot downloads the server jar (and modloader/modpack) —
          # generous startup budget; liveness kicks in only after startup.
          startupProbe:
            tcpSocket:
              port: {{ .Values.gamePort }}
            initialDelaySeconds: 10
            failureThreshold: 120
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.gamePort }}
            failureThreshold: 6
            periodSeconds: 30
          resources:
            requests:
              cpu: "{{ .Values.cpu }}"
              memory: "{{ .Values.memory }}"
            {{- if or .Values.cpuLimit .Values.memoryLimit }}
            limits:
              {{- if .Values.cpuLimit }}
              cpu: "{{ .Values.cpuLimit }}"
              {{- end }}
              {{- if .Values.memoryLimit }}
              memory: "{{ .Values.memoryLimit }}"
              {{- end }}
            {{- end }}
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - name: data
              mountPath: /data
              subPath: data
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}
            {{- if .Values.plugins }}
            {{- range .Values.plugins }}
            - name: {{ .name | quote }}
              subPath: {{ .file | quote }}
              mountPath: "/etc/helios/init.d/{{ .name }}/{{ .file }}"
            {{- end }}
            {{- end }}
      {{- if .Values.volumeMounts }}
      securityContext:
        fsGroup: 1000
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "{{ .Values.name }}-data"
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        {{- if .Values.volumeMounts }}
        {{- toYaml .Values.volumes | nindent 8 }}
        {{- end }}
        {{- if .Values.plugins }}
        {{- range .Values.plugins }}
        - name: {{ .name | quote }}
          configMap:
            name: {{ .config | quote }}
            defaultMode: 0777
        {{- end }}
        {{- end }}
