apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-terra-metadata"
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Server"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "Space Engineers dedicated server (Devidian image) — the Windows server under Wine on Debian 12."
  fields: |
    - name: icon
      default: "https://raw.githubusercontent.com/aldmbmtl/Terra-Games/main/plugins/space-engineers/assets/logo.png"
    - name: registry
      description: "Container registry"
      type: string
      required: true
      default: "docker.io"
    - name: repo
      description: "Image repository"
      type: string
      required: true
      default: "devidian/spaceengineers"
    - name: tag
      description: "Image tag — latest (Wine 9.0) or winestaging (Wine 9.9)"
      type: select
      options:
        - latest
        - winestaging
      required: true
      default: "latest"
    - name: instance_name
      description: "World instance name — create the world with the Space Engineers Dedicated Server tool and upload it to instances/<name>/ first"
      type: string
      required: true
      default: "instance"
    - name: public_ip
      description: "Public IP of the server (used by the image's healthcheck; optional in Kubernetes)"
      type: string
      required: false
      default: ""
    - name: cpu
      description: "CPU cores (request)"
      type: string
      required: false
      default: "2"
    - name: memory
      description: "Memory request — Wine + server needs headroom"
      type: string
      required: false
      default: "4Gi"
    - name: cpuLimit
      description: "CPU limit (empty = no limit)"
      type: string
      required: false
      default: ""
    - name: memoryLimit
      description: "Memory limit (default 8Gi — Wine + server headroom)"
      type: string
      required: false
      default: "8Gi"
    - name: gpu
      description: "Attach a GPU to this workload"
      type: boolean
      required: false
      default: false
    - name: publicAccess
      description: "Allow public access (disable authentication)"
      type: boolean
      required: false
      default: false
    - name: storage_class
      description: "StorageClass for the world volume (required)."
      type: k8sStorageClass
      required: true
    - name: storage_size
      description: "World volume size in Gi."
      type: int
      required: false
      default: 20
  env_hints: |
    - name: WINEDEBUG
      description: "Wine debug output (default -all)"
